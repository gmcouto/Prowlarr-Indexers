---
name: Publish Definition Branches

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: publish-definitions-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-v11:
    name: Rebuild orphan v11 branch
    runs-on: ubuntu-24.04
    if: github.repository == 'gmcouto/Prowlarr-Gaucho-Indexers'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.WORKFLOWS_TOKEN }}

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish v11 branch
        env:
          SOURCE_BRANCH: master
          TARGET_BRANCH: v11
          ORIGIN_REMOTE: origin
          BASE_DEFINITIONS_DIR: definitions/v11
          CUSTOM_DEFINITIONS_DIR: custom-definitions/v11
        run: |
          chmod +x ./scripts/publish-definitions.sh
          ./scripts/publish-definitions.sh

      - name: Summary
        if: always()
        run: |
          echo "Source branch: master"
          echo "Published branch: v11 (orphan, v11.zip only)"
          echo "Sources: definitions/v11 + custom-definitions/v11"

  publish-v12:
    name: Rebuild orphan v12 branch
    runs-on: ubuntu-24.04
    if: github.repository == 'gmcouto/Prowlarr-Gaucho-Indexers'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.WORKFLOWS_TOKEN }}

      - name: Install zip utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish v12 branch
        env:
          SOURCE_BRANCH: master
          TARGET_BRANCH: v12
          ORIGIN_REMOTE: origin
          BASE_DEFINITIONS_DIR: definitions/v12
          CUSTOM_DEFINITIONS_DIR: custom-definitions/v12
          FALLBACK_DEFINITIONS_DIR: definitions/v11
        run: |
          chmod +x ./scripts/publish-definitions.sh
          ./scripts/publish-definitions.sh

      - name: Summary
        if: always()
        run: |
          echo "Source branch: master"
          echo "Published branch: v12 (orphan, v12.zip only)"
          echo "Sources: definitions/v12 + fallback definitions/v11 + custom-definitions/v12"
